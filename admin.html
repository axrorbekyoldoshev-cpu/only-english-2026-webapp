<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin panel — Only English 2026</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --fb-bg:#f1f3f6;--fb-card:#ffffff;--fb-text:#12161c;--fb-hint:#6b7684;
  --fb-accent:#2481cc;--fb-accent-text:#ffffff;--fb-border:rgba(15,20,25,.12);
  --fb-danger:#e5484d;--fb-good:#2fae5c;--fb-warn:#c98a1a;
}
@media (prefers-color-scheme:dark){
  :root{
    --fb-bg:#0f1216;--fb-card:#1a1f26;--fb-text:#eef1f5;--fb-hint:#8a94a1;
    --fb-accent:#4da3e0;--fb-accent-text:#0b0f13;--fb-border:rgba(255,255,255,.12);
    --fb-danger:#ff6b6f;--fb-good:#3ecb75;--fb-warn:#e0a83c;
  }
}
:root{
  --bg:var(--tg-theme-bg-color,var(--fb-bg));
  --card:var(--tg-theme-secondary-bg-color,var(--fb-card));
  --text:var(--tg-theme-text-color,var(--fb-text));
  --hint:var(--tg-theme-hint-color,var(--fb-hint));
  --accent:var(--tg-theme-button-color,var(--fb-accent));
  --accent-text:var(--tg-theme-button-text-color,var(--fb-accent-text));
  --border:var(--fb-border);--danger:var(--fb-danger);--good:var(--fb-good);--warn:var(--fb-warn);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:96px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;box-shadow:0 1px 0 var(--border)}
.topbar-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.topbar-icon{width:36px;height:36px;border-radius:11px;background:var(--accent);background:linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#7a4de0));display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.topbar h1{font-size:16px;margin:0}
.topbar .count{color:var(--hint);font-size:12px;margin-top:1px}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-top:12px;overflow:hidden;animation:cardIn .25s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hint-card{padding:22px 18px;color:var(--hint);font-size:13.5px;text-align:center}

.app-head{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer}
.avatar{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
.app-info{flex:1;min-width:0}
.app-name{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-sub{color:var(--hint);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--hint);flex:none;transition:transform .18s;font-size:13px}
.chev.open{transform:rotate(180deg)}

.app-body{padding:0 15px 15px;animation:bodyIn .2s ease both}
@keyframes bodyIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.pill-row{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:6px}
.pill{padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:700;background:color-mix(in srgb,var(--accent) 14%,var(--bg));color:var(--accent)}

.detail-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border);font-size:13px}
.detail-row .k{color:var(--hint);flex:none}
.detail-row .v{text-align:right;font-weight:600}

.ghost-btn{width:100%;margin-top:10px;padding:11px;border-radius:11px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-weight:700;font-size:13px;cursor:pointer}
.ghost-btn:active{transform:scale(.98)}

.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:4px;margin-top:12px}
.seg-btn{flex:1;padding:10px 6px;border:0;border-radius:10px;background:transparent;color:var(--hint);font-weight:700;font-size:12.5px;cursor:pointer;transition:.15s}
.seg-btn.active{background:var(--accent);color:var(--accent-text)}

.status-pill{padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:700}
.status-pill.rejected{background:color-mix(in srgb,var(--danger) 16%,var(--bg));color:var(--danger)}
.status-pill.revision_requested{background:color-mix(in srgb,var(--warn) 16%,var(--bg));color:var(--warn)}
.status-pill.approved{background:color-mix(in srgb,var(--good) 16%,var(--bg));color:var(--good)}

.act-btn.restore{background:var(--accent);width:100%;margin-top:14px}

.app-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.act-btn{flex:1 1 auto;min-width:104px;padding:12px 10px;border-radius:11px;border:0;font-weight:800;font-size:13px;cursor:pointer;color:#fff;transition:transform .1s,opacity .15s}
.act-btn.approve{background:var(--good)}
.act-btn.reject{background:var(--danger)}
.act-btn.revise{background:var(--warn)}
.act-btn:active{transform:scale(.97)}

.confirm-box{margin-top:12px;padding:13px;border-radius:12px;background:color-mix(in srgb,var(--good) 12%,var(--bg));border:1.5px solid color-mix(in srgb,var(--good) 35%,var(--border))}
.confirm-box.danger{background:color-mix(in srgb,var(--danger) 10%,var(--bg));border-color:color-mix(in srgb,var(--danger) 30%,var(--border))}
.confirm-box.warn{background:color-mix(in srgb,var(--warn) 12%,var(--bg));border-color:color-mix(in srgb,var(--warn) 32%,var(--border))}
.confirm-text{font-size:13px;font-weight:700;margin:0 0 10px}
.confirm-row{display:flex;gap:8px}
.confirm-row .act-btn{flex:1}
.confirm-row .cancel-btn{flex:1;padding:12px 10px;border-radius:11px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-weight:700;font-size:13px;cursor:pointer}

.note-input{width:100%;min-height:78px;padding:11px 12px;border-radius:11px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font:inherit;resize:vertical;margin-bottom:10px}
.note-input:focus{outline:none;border-color:var(--accent)}

.sending{position:relative;pointer-events:none;opacity:.7}

.navbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 30%);z-index:15}
.navbar-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.page-btn{flex:1;padding:13px;border:0;border-radius:12px;background:var(--card);border:1.5px solid var(--border);color:var(--text);font-weight:700;font-size:13.5px;cursor:pointer}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-info{flex:none;color:var(--hint);font-size:12px;min-width:78px;text-align:center}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-icon">🔐</div>
    <div>
      <h1 id="title">Kutilayotgan arizalar</h1>
      <p class="count" id="count">—</p>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="seg" id="seg">
    <button type="button" class="seg-btn active" data-mode="pending">📋 Kutilmoqda</button>
    <button type="button" class="seg-btn" data-mode="approved">✅ Qabul qilingan</button>
    <button type="button" class="seg-btn" data-mode="rejected">↩️ Rad etilgan</button>
  </div>
  <div id="list"></div>
</div>

<div class="navbar">
  <div class="navbar-inner">
    <button class="page-btn" id="prev_btn" type="button">◀ Oldingi</button>
    <span class="page-info" id="page_info"></span>
    <button class="page-btn" id="next_btn" type="button">Keyingi ▶</button>
  </div>
</div>

<script>
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : {
  ready(){}, expand(){}, close(){}, sendData(){}, setHeaderColor(){}, openLink(){},
  HapticFeedback:{ impactOccurred(){}, notificationOccurred(){}, selectionChanged(){} },
  MainButton:{ hide(){} },
};
tg.ready();
tg.expand();
try{ tg.setHeaderColor && tg.setHeaderColor('secondary_bg_color'); }catch(e){}
try{ tg.MainButton && tg.MainButton.hide(); }catch(e){}

function hapticSelect(){ try{ tg.HapticFeedback.selectionChanged(); }catch(e){} }
function hapticNotify(kind){ try{ tg.HapticFeedback.notificationOccurred(kind); }catch(e){} }
function hapticImpact(kind){ try{ tg.HapticFeedback.impactOccurred(kind||"medium"); }catch(e){} }

function b64urlDecode(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length % 4) s += "=";
  try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return null; }
}

function escapeHtml(s){
  return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function initials(name){
  const parts = (name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
}

const AVATAR_COLORS = ["#2481cc","#7a4de0","#2fae5c","#c98a1a","#e5484d","#0f9b8e","#c2427a"];
function avatarColor(id){
  return AVATAR_COLORS[Math.abs(Number(id)||0) % AVATAR_COLORS.length];
}

const params = new URLSearchParams(location.search);
// Both tabs' full lists are embedded in this one payload, so switching tabs
// and paging through results is pure client-side work below — no sendData()
// call, which means Telegram never closes the Mini App for either action.
let data = null;
const raw = params.get("data");
if(raw){
  const decoded = b64urlDecode(raw);
  if(decoded){
    try{ data = JSON.parse(decoded); }catch(e){ data = null; }
  }
}
const pageSize = (data && data.page_size) || 8;
const VALID_MODES = ["pending", "approved", "rejected"];
let currentMode = (data && VALID_MODES.includes(data.mode)) ? data.mode : "pending";
let currentOffset = 0;

function currentTab(){
  if(!data) return null;
  return data[currentMode] || null;
}

const listEl = document.getElementById("list");
const titleEl = document.getElementById("title");
const countEl = document.getElementById("count");
const pageInfoEl = document.getElementById("page_info");
const prevBtn = document.getElementById("prev_btn");
const nextBtn = document.getElementById("next_btn");
const segEl = document.getElementById("seg");

function send(action, extra, sourceEl){
  if(sourceEl) sourceEl.classList.add("sending");
  const payload = Object.assign({ action, mode: currentMode }, extra || {});
  tg.sendData(JSON.stringify(payload));
  tg.close();
}

segEl.querySelectorAll(".seg-btn").forEach(btn=>{
  btn.onclick = ()=>{
    const target = btn.dataset.mode;
    if(currentMode === target) return;
    hapticImpact("light");
    currentMode = target;
    currentOffset = 0;
    renderList();
  };
});

function renderMessage(msg){
  listEl.innerHTML = "";
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="hint-card">${escapeHtml(msg)}</div>`;
  listEl.appendChild(card);
}

const STATUS_LABELS = {rejected: "❌ Rad etildi", revision_requested: "✏️ Tuzatishga qaytarildi", approved: "✅ Qabul qilindi"};

function buildBody(app, body, mode){
  const isRejected = mode === "rejected";
  const isApproved = mode === "approved";
  const pillRow = document.createElement("div");
  pillRow.className = "pill-row";
  [app.role, app.performance].filter(Boolean).forEach(text=>{
    pillRow.appendChild(el(`<span class="pill">${escapeHtml(text)}</span>`));
  });
  if((isRejected || isApproved) && STATUS_LABELS[app.status]){
    pillRow.appendChild(el(`<span class="status-pill ${app.status}">${STATUS_LABELS[app.status]}</span>`));
  }
  body.appendChild(pillRow);

  const rows = [
    ["Telefon", app.phone], ["Ilmiy rahbar", app.supervisor],
    ["Rahbar lavozimi", app.head_position], ["Ma'ruza mavzusi", app.report_title],
    ["Telegram akkaunt", app.telegram_account], ["Taklif/savollar", app.suggestions],
    ["Yuborilgan vaqt", app.created_at],
  ];
  if(isRejected) rows.push(["Komissiya izohi", app.admin_note]);
  rows.forEach(([k, v])=>{
    if(!v) return;
    body.appendChild(el(`<div class="detail-row"><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v)}</span></div>`));
  });

  const filesBtn = el(`<button type="button" class="ghost-btn">📎 Fayllarni botda ko‘rish</button>`);
  filesBtn.onclick = (e)=>{ e.stopPropagation(); hapticImpact("light"); send("view_files", {application_id: app.id}, filesBtn); };
  body.appendChild(filesBtn);

  if(app.drive_url){
    const driveBtn = el(`<button type="button" class="ghost-btn">🗂 Google Drive papkasini ochish</button>`);
    driveBtn.onclick = (e)=>{
      e.stopPropagation();
      hapticImpact("light");
      try{ tg.openLink(app.drive_url); }catch(err){ window.open(app.drive_url, "_blank"); }
    };
    body.appendChild(driveBtn);
  }

  // Approved applications are final — nothing left to act on here.
  if(isApproved) return;

  const zone = el(`<div></div>`);

  if(isRejected){
    const restoreBtn = el(`<button type="button" class="act-btn restore">↩️ Qayta yuborishga ruxsat berish</button>`);
    body.appendChild(restoreBtn);
    body.appendChild(zone);
    function clearZone(){ zone.innerHTML = ""; }
    restoreBtn.onclick = (e)=>{
      e.stopPropagation();
      hapticImpact("medium");
      clearZone();
      restoreBtn.style.display = "none";
      const box = el(`
        <div class="confirm-box">
          <p class="confirm-text">↩️ Ariza #${app.id} — ${escapeHtml(app.full_name)}ga qayta yuborishga ruxsat berilsinmi?</p>
          <div class="confirm-row">
            <button type="button" class="cancel-btn">Bekor qilish</button>
            <button type="button" class="act-btn restore">Ha, ruxsat berish</button>
          </div>
        </div>
      `);
      box.querySelector(".cancel-btn").onclick = (ev)=>{ ev.stopPropagation(); clearZone(); restoreBtn.style.display = "block"; };
      box.querySelector(".act-btn.restore").onclick = (ev)=>{
        ev.stopPropagation();
        hapticNotify("success");
        send("restore", {application_id: app.id}, box);
      };
      zone.appendChild(box);
    };
    return;
  }

  const actions = el(`<div class="app-actions"></div>`);
  const approveBtn = el(`<button type="button" class="act-btn approve">✅ Qabul qilish</button>`);
  const rejectBtn = el(`<button type="button" class="act-btn reject">❌ Rad etish</button>`);
  const reviseBtn = el(`<button type="button" class="act-btn revise">✏️ Tuzatishga qaytarish</button>`);
  actions.appendChild(approveBtn); actions.appendChild(rejectBtn); actions.appendChild(reviseBtn);
  body.appendChild(actions);
  body.appendChild(zone);

  function clearZone(){ zone.innerHTML = ""; }

  approveBtn.onclick = (e)=>{
    e.stopPropagation();
    hapticImpact("medium");
    clearZone();
    actions.style.display = "none";
    const box = el(`
      <div class="confirm-box">
        <p class="confirm-text">✅ Ariza #${app.id} — ${escapeHtml(app.full_name)} qabul qilinsinmi?</p>
        <div class="confirm-row">
          <button type="button" class="cancel-btn">Bekor qilish</button>
          <button type="button" class="act-btn approve">Ha, qabul qilish</button>
        </div>
      </div>
    `);
    box.querySelector(".cancel-btn").onclick = (ev)=>{ ev.stopPropagation(); clearZone(); actions.style.display = "flex"; };
    box.querySelector(".act-btn.approve").onclick = (ev)=>{
      ev.stopPropagation();
      hapticNotify("success");
      send("approve", {application_id: app.id}, box);
    };
    zone.appendChild(box);
  };

  function openNoteConfirm(kind){
    clearZone();
    actions.style.display = "none";
    const isReject = kind === "reject";
    const box = el(`
      <div class="confirm-box ${isReject ? "danger" : "warn"}">
        <p class="confirm-text">${isReject ? "❌ Rad etish sababini yozing" : "✏️ Qanday tuzatish kerakligini yozing"}</p>
        <textarea class="note-input" placeholder="Izoh..."></textarea>
        <div class="confirm-row">
          <button type="button" class="cancel-btn">Bekor qilish</button>
          <button type="button" class="act-btn ${isReject ? "reject" : "revise"}">${isReject ? "Rad etib, yuborish" : "Qaytarib, yuborish"}</button>
        </div>
      </div>
    `);
    const textarea = box.querySelector(".note-input");
    box.querySelector(".cancel-btn").onclick = (ev)=>{ ev.stopPropagation(); clearZone(); actions.style.display = "flex"; };
    box.querySelector(".act-btn").onclick = (ev)=>{
      ev.stopPropagation();
      const note = textarea.value.trim();
      if(!note){ hapticNotify("error"); textarea.focus(); return; }
      send(kind, {application_id: app.id, note}, box);
    };
    zone.appendChild(box);
    setTimeout(()=>textarea.focus(), 50);
  }

  rejectBtn.onclick = (e)=>{ e.stopPropagation(); hapticImpact("light"); openNoteConfirm("reject"); };
  reviseBtn.onclick = (e)=>{ e.stopPropagation(); hapticImpact("light"); openNoteConfirm("revise"); };
}

function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }

const MODE_META = {
  pending: {title:"Kutilayotgan arizalar", countSuffix:" ta kutilmoqda", empty:"Kutilayotgan arizalar yo‘q. 🎉"},
  approved: {title:"Qabul qilingan arizalar", countSuffix:" ta qabul qilingan", empty:"Qabul qilingan arizalar yo‘q."},
  rejected: {title:"Rad etilgan arizalar", countSuffix:" ta rad etilgan", empty:"Rad etilgan arizalar yo‘q."},
};

function renderList(){
  segEl.querySelectorAll(".seg-btn").forEach(btn=>{
    btn.classList.toggle("active", currentMode === btn.dataset.mode);
  });

  const tab = currentTab();
  if(!data || !tab){
    countEl.textContent = "";
    pageInfoEl.textContent = "";
    prevBtn.disabled = true; nextBtn.disabled = true;
    renderMessage("Ma'lumot topilmadi. Botdagi “Admin panel” tugmasidan qaytadan oching.");
    return;
  }
  const meta = MODE_META[currentMode];
  const allApps = tab.apps || [];
  const total = tab.total || 0;
  if(currentOffset >= allApps.length) currentOffset = Math.max(0, allApps.length - pageSize);
  const pageApps = allApps.slice(currentOffset, currentOffset + pageSize);

  titleEl.textContent = meta.title;
  countEl.textContent = total + meta.countSuffix;
  if(allApps.length){
    const from = currentOffset + 1;
    const to = Math.min(currentOffset + pageApps.length, allApps.length);
    pageInfoEl.textContent = `${from}–${to} / ${allApps.length}`;
  } else {
    pageInfoEl.textContent = "";
  }
  prevBtn.disabled = currentOffset <= 0;
  nextBtn.disabled = currentOffset + pageSize >= allApps.length;

  listEl.innerHTML = "";
  if(!pageApps.length){
    renderMessage(meta.empty);
    return;
  }
  pageApps.forEach((app, i)=>{
    const card = el(`<div class="card"></div>`);
    card.style.animationDelay = Math.min(i * 40, 240) + "ms";
    const head = el(`
      <div class="app-head">
        <div class="avatar" style="background:${avatarColor(app.id)}">${escapeHtml(initials(app.full_name))}</div>
        <div class="app-info">
          <div class="app-name">#${app.id} — ${escapeHtml(app.full_name)}</div>
          <div class="app-sub">${escapeHtml(app.university)}</div>
          <div class="app-sub">${escapeHtml(app.section)} — ${escapeHtml(app.direction)}</div>
        </div>
        <div class="chev">▾</div>
      </div>
    `);
    card.appendChild(head);
    const chev = head.querySelector(".chev");
    let body = null;
    head.onclick = ()=>{
      hapticSelect();
      if(body){
        const open = body.style.display !== "none";
        body.style.display = open ? "none" : "block";
        chev.classList.toggle("open", !open);
        return;
      }
      body = el(`<div class="app-body"></div>`);
      card.appendChild(body);
      buildBody(app, body, currentMode);
      chev.classList.add("open");
    };
    listEl.appendChild(card);
  });
}

prevBtn.onclick = ()=>{
  if(prevBtn.disabled) return;
  hapticImpact("light");
  currentOffset = Math.max(0, currentOffset - pageSize);
  renderList();
};
nextBtn.onclick = ()=>{
  if(nextBtn.disabled) return;
  hapticImpact("light");
  currentOffset += pageSize;
  renderList();
};

renderList();
</script>
</body>
</html>
