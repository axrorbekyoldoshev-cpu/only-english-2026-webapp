<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Only English 2026</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --fb-bg:#f1f3f6;--fb-card:#ffffff;--fb-text:#12161c;--fb-hint:#6b7684;
  --fb-accent:#2481cc;--fb-accent-text:#ffffff;--fb-border:rgba(15,20,25,.12);--fb-danger:#e5484d;--fb-good:#2fae5c;
}
@media (prefers-color-scheme:dark){
  :root{
    --fb-bg:#0f1216;--fb-card:#1a1f26;--fb-text:#eef1f5;--fb-hint:#8a94a1;
    --fb-accent:#4da3e0;--fb-accent-text:#0b0f13;--fb-border:rgba(255,255,255,.12);--fb-danger:#ff6b6f;--fb-good:#3ecb75;
  }
}
:root{
  --bg:var(--tg-theme-bg-color,var(--fb-bg));
  --card:var(--tg-theme-secondary-bg-color,var(--fb-card));
  --text:var(--tg-theme-text-color,var(--fb-text));
  --hint:var(--tg-theme-hint-color,var(--fb-hint));
  --accent:var(--tg-theme-button-color,var(--fb-accent));
  --accent-text:var(--tg-theme-button-text-color,var(--fb-accent-text));
  --border:var(--fb-border);--danger:var(--fb-danger);--good:var(--fb-good);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:104px;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:calc(env(safe-area-inset-top) + 14px);box-shadow:0 1px 0 var(--border)}
.brand{display:flex;align-items:center;gap:12px;padding:0 16px 14px;max-width:520px;margin:0 auto}
.brand-badge{
  flex:none;width:38px;height:38px;border-radius:11px;background:var(--accent);
  background:linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#7a4de0));
  color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
}
.brand h1{font-size:16px;margin:0;line-height:1.25}
.brand p{margin:2px 0 0;color:var(--hint);font-size:12px}
.progress-track{height:4px;background:var(--border);overflow:hidden}
.progress-fill{height:100%;width:0%;background:var(--accent);background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#7a4de0));transition:width .3s ease}

.step-shell{animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-top:16px}
.step-eyebrow{color:var(--hint);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.step-title{font-size:19px;font-weight:800;margin:0 0 6px}
.step-hint{color:var(--hint);font-size:13px;margin:0 0 16px}

/* Fields */
input[type=text],textarea{
  width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid var(--border);
  background:var(--bg);color:var(--text);font:inherit;transition:border-color .15s,box-shadow .15s;
}
textarea{min-height:90px;resize:vertical;font-family:inherit}
input:focus,textarea:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(36,129,204,.2);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);
}

/* Chips */
.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 17px;border-radius:999px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.chip.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}

/* Tiles */
.tile-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding-right:2px}
.tile{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-radius:13px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;transition:.15s}
.tile span{font-size:13.5px;font-weight:600;line-height:1.3}
.tile .check{flex:none;width:19px;height:19px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px}
.tile.active{border-color:var(--accent);background:var(--card);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.tile.active .check{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}

/* Picker trigger */
.select-trigger{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;user-select:none;padding:13px 14px;border-radius:13px;border:1.5px solid var(--border);background:var(--bg)}
.select-trigger .val.placeholder{color:var(--hint)}
.select-trigger .chev{color:var(--hint);flex:none}

/* Checkpoint screen */
.checkpoint-icon{width:56px;height:56px;border-radius:16px;background:color-mix(in srgb,var(--accent) 14%,var(--bg));display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:12px}
.checkpoint-desc{color:var(--text);font-size:14px;line-height:1.55;margin:0 0 4px}
.checkpoint-done{display:flex;align-items:center;gap:8px;color:var(--good);font-weight:700;font-size:13.5px;margin-top:14px}

/* Review */
.review-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.review-row:last-child{border-bottom:none}
.review-row .k{color:var(--hint)}
.review-row .v{font-weight:600;text-align:right;max-width:60%}
.review-flag{display:flex;align-items:center;gap:8px;padding:9px 0;font-size:13.5px;font-weight:600}
.review-flag.ok{color:var(--good)}
.review-flag.missing{color:var(--danger);cursor:pointer}

/* Bottom nav */
.navbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 30%);z-index:15}
.navbar-inner{max-width:520px;margin:0 auto;display:flex;gap:10px}
.nav-btn{flex:1;padding:15px;border:0;border-radius:14px;font-weight:800;font-size:14.5px;cursor:pointer;transition:opacity .15s,transform .1s}
.nav-btn.primary{background:var(--accent);color:var(--accent-text);box-shadow:0 6px 18px rgba(0,0,0,.22);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.nav-btn.secondary{flex:0 0 92px;background:var(--card);color:var(--text);border:1.5px solid var(--border)}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}
.nav-btn:active:not(:disabled){transform:scale(.98)}

.toast{position:fixed;left:50%;bottom:118px;transform:translate(-50%,10px);background:var(--danger);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:40;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.info{background:var(--accent)}

/* Sheet */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:30}
.sheet-backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;background:var(--card);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .28s ease;z-index:31;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:10px auto 6px}
.sheet-title{font-size:14px;font-weight:700;text-align:center;margin:0 0 10px}
.sheet-search{margin:0 16px 10px;padding:11px 13px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font:inherit}
.sheet-search:focus{outline:none;border-color:var(--accent)}
.sheet-list{overflow-y:auto;padding:0 16px 16px}
.sheet-item{padding:13px 6px;border-bottom:1px solid var(--border);font-size:14px;cursor:pointer}
.sheet-item:last-child{border-bottom:none}
.sheet-item.active{color:var(--accent);font-weight:700}
.sheet-empty{color:var(--hint);text-align:center;padding:20px 0;font-size:13px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-badge">OE</div>
    <div>
      <h1>Only English 2026</h1>
      <p>Ilmiy-amaliy konferensiyaga ro‘yxatdan o‘tish</p>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress_fill"></div></div>
</div>

<div class="wrap">
  <div class="step-shell" id="step_shell"></div>
</div>

<div class="navbar">
  <div class="navbar-inner">
    <button class="nav-btn secondary" id="back_btn" type="button">Orqaga</button>
    <button class="nav-btn primary" id="primary_btn" type="button">Davom etish</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="sheet-backdrop" id="uni_backdrop"></div>
<div class="sheet" id="uni_sheet">
  <div class="sheet-handle"></div>
  <p class="sheet-title">Universitet / tashkilotni tanlang</p>
  <input type="text" class="sheet-search" id="uni_search" placeholder="Qidirish...">
  <div class="sheet-list" id="uni_list"></div>
</div>

<script>
const tgReady = !!(window.Telegram && window.Telegram.WebApp);
const tg = tgReady ? window.Telegram.WebApp : {
  ready(){}, expand(){}, close(){}, sendData(){}, setHeaderColor(){}, setBackgroundColor(){},
  HapticFeedback:{ impactOccurred(){}, notificationOccurred(){}, selectionChanged(){} },
  MainButton:{ setText(){}, show(){}, hide(){}, enable(){}, disable(){}, onClick(){} },
  BackButton:{ show(){}, hide(){}, onClick(){}, offClick(){} },
  initData:'',
};
tg.ready();
tg.expand();
try{ tg.setHeaderColor && tg.setHeaderColor('secondary_bg_color'); }catch(e){}
try{ tg.MainButton && tg.MainButton.hide(); }catch(e){}
const inTelegram = !!tg.initData;

/* Desktop clients open Mini Apps in a small, resizable window by default.
   Lock those to a fixed full-screen window; phones already open effectively
   full-screen via expand(), so leave their native behavior untouched. */
try{
  const DESKTOP_PLATFORMS = ["tdesktop", "macos", "web", "weba", "webk", "windows", "linux"];
  if(typeof tg.requestFullscreen === "function" && DESKTOP_PLATFORMS.includes(tg.platform)){
    tg.requestFullscreen();
  }
}catch(e){}

function haptic(kind){ try{ tg.HapticFeedback.impactOccurred(kind||"light"); }catch(e){} }
function hapticSelect(){ try{ tg.HapticFeedback.selectionChanged(); }catch(e){} }
function hapticNotify(kind){ try{ tg.HapticFeedback.notificationOccurred(kind); }catch(e){} }

const SECTIONS = {
  "1": ["I Section: THERAPY", ["Internal diseases","Faculty and hospital therapy","Internal medicine propaedeutic","Pharmacology","Endocrinology"]],
  "2": ["II Section: SURGERY", ["General surgery","Faculty and hospital surgery","Anesthesiology and resuscitation","Ophthalmology","Otorhinolaryngology, dentistry and maxillo-facial surgery","Traumatology and Orthopedics"]],
  "3": ["III Section: OBSTETRICS AND GYNECOLOGY", ["Obstetrics and gynecology"]],
  "4": ["IV Section: PEDIATRICS", ["Pediatrics","Propaedeutics of Childhood Diseases","Neonatology"]],
  "5": ["V Section: DENTISTRY", ["Hospital Therapeutic Dentistry","Faculty Therapeutic Dentistry","Propaedeutics of Orthopedic Dentistry"]],
  "6": ["VI Section: Medical prevention", ["Environmental hygiene","Communal and labor hygiene","Epidemiology","Children, adolescents and food hygiene","Microbiology and virology"]],
  "7": ["VII Section: MANAGEMENT AND MODERN MEDICAL TECHNOLOGIES", ["Biophysics and Biomedical Engineering","Informatics, Mathematics and Statistics in Medicine","Medical Radiology","Healthcare Organization and Management","School of Public Health"]],
  "8": ["VIII Section: CLINICAL SPECIALTIES", ["Rehabilitation and Traditional Medicine","Infectious Diseases","Dermatovenerology","Hematology and Transfusiology","Allergology"]],
  "9": ["IX Section: NEUROLOGY", ["Neurology","Psychiatry and Medical Psychology","Psychotherapy","Medical Genetics"]],
  "10": ["X Section: FUNDAMENTAL SCIENCES", ["Normal and Pathological Physiology","Human Anatomy and Basics of Surgical Techniques (OXTA)","Pathological Anatomy","Forensic Medicine and Medical Law","Histology and Medical Biology","Medical and Biological Chemistry"]],
};
const UNIVERSITIES = [
  "Tashkent State Medical University","Tashkent State Medical University Chirchik B","Tashkent State Medical University Termiz B",
  "Urganch Medical Institute","Bukhoro State Medical Institute","Samarkand State Medical University","Tashkent Pharmaceutical Institute",
  "Central Asian Medical University","Andijan State Medical Institute","EMU University","Fergana Medical Institute of Public Health",
  "Military Medical Academy of the Armed Forces of the Republic of Uzbekistan","Karakalpakstan Medical Institute","Other",
];
const ROLES = [["Student","Student"],["Master","Master"],["Doctoral student","Doctoral student"],["Applicant","Applicant"]];
const PERFORMANCES = [["Publication only","Faqat maqola"],["Presentation only","Faqat taqdimot"],["Presentation and publication","Taqdimot + maqola"]];

const state = {
  full_name:"", role:"", supervisor:"", head_position:"", university:"", section_id:"", section:"",
  direction:"", performance:"", report_title:"", telegram_account:"", suggestions:"",
  passport_done:false, phone_done:false, article_done:false, antiplag_done:false, presentation_done:false,
};

function needsArticle(s){ return s.performance === "Publication only" || s.performance === "Presentation and publication"; }
function needsPresentation(s){ return s.performance === "Presentation only" || s.performance === "Presentation and publication"; }

const STEP_DEFS = [
  {id:"full_name", kind:"text", field:"full_name", title:"Ism-familiya", hint:"Ism-familiyani ingliz tilida yozing", placeholder:"Masalan: Aziz Yuldashev"},
  {id:"passport", kind:"checkpoint", checkpoint:"passport", doneFlag:"passport_done", icon:"🪪", title:"Pasport", desc:"Pasport yoki ID karta nusxasini (PDF, JPG yoki PNG) botga yuborasiz. Fayl qabul qilingach, forma aynan shu yerdan davom etadi.", buttonLabel:"📎 Pasportni yuklash"},
  {id:"role", kind:"chips", field:"role", options:ROLES, title:"Status", hint:"Statusingizni tanlang"},
  {id:"phone", kind:"checkpoint", checkpoint:"phone", doneFlag:"phone_done", icon:"📱", title:"Telefon raqam", desc:"Telegram akkauntingizga tegishli telefon raqamni ulashasiz. Bot faqat shu akkauntga tegishli raqamni qabul qiladi.", buttonLabel:"📱 Raqamni yuborish"},
  {id:"supervisor", kind:"text", field:"supervisor", title:"Ilmiy rahbar", hint:"Ism-familiyani ingliz tilida yozing", placeholder:"Rahbaringiz ism-familiyasi"},
  {id:"head_position", kind:"text", field:"head_position", title:"Rahbar lavozimi", hint:"Lavozimni ingliz tilida yozing", placeholder:"Masalan: Professor, kafedra mudiri"},
  {id:"university", kind:"picker", field:"university", title:"Universitet", hint:"Ta'lim muassasangizni tanlang"},
  {id:"section", kind:"section", title:"Seksiya", hint:"10 seksiyadan faqat BITTASI tanlanadi"},
  {id:"direction", kind:"direction", title:"Yo‘nalish", hint:"Shu seksiya ichidan faqat BITTA yo‘nalish tanlanadi"},
  {id:"performance", kind:"chips", field:"performance", options:PERFORMANCES, title:"Qatnashish turi", hint:"Qanday qatnashishni tanlaysiz?"},
  {id:"files", kind:"checkpoint", checkpoint:"files", doneFlag:"article_done", icon:"📄", title:"Maqola va antiplagiat", desc:"Maqolani (DOC/DOCX, bir nechta fayl bo‘lishi mumkin) va antiplagiat ma'lumotnomasini (PDF/JPG/PNG) botga yuborasiz.", buttonLabel:"📎 Fayllarni yuklash", when: needsArticle},
  {id:"report_title", kind:"text", field:"report_title", title:"Ma'ruza mavzusi", hint:"Taqdimot mavzusini kiriting", placeholder:"Ma'ruza mavzusi", when: needsPresentation},
  {id:"presentation", kind:"checkpoint", checkpoint:"presentation", doneFlag:"presentation_done", icon:"📊", title:"Taqdimot fayli", desc:"Taqdimotni PPT yoki PPTX faylida botga yuborasiz.", buttonLabel:"📎 Taqdimotni yuklash", when: needsPresentation},
  {id:"telegram_account", kind:"text", field:"telegram_account", title:"Telegram akkaunt", hint:"Telegram foydalanuvchi nomingiz", placeholder:"@Yuldashev_A23"},
  {id:"suggestions", kind:"textarea", field:"suggestions", title:"Takliflar", hint:"Taklif yoki savollar (ixtiyoriy)", placeholder:"Bo‘lmasa bo‘sh qoldiring", optional:true},
  {id:"review", kind:"review", title:"Tekshirish", hint:"Ma'lumotlarni tekshirib, yuboring"},
];

function visibleSteps(){ return STEP_DEFS.filter(s => !s.when || s.when(state)); }
function findStep(id){ return STEP_DEFS.find(s=>s.id===id); }

function b64urlDecode(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length % 4) s += "=";
  try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return null; }
}

function applyResume(){
  const params = new URLSearchParams(location.search);
  const s = params.get("s");
  const step = params.get("step");
  if(s){
    const decoded = b64urlDecode(s);
    if(decoded){
      try{
        const obj = JSON.parse(decoded);
        Object.keys(obj).forEach(k=>{ if(k in state) state[k] = obj[k]; });
      }catch(e){}
    }
  }
  return step;
}
let currentId = applyResume() || "full_name";
if(!findStep(currentId)) currentId = "full_name";

function textPayload(){
  const keys = ["full_name","role","supervisor","head_position","university","section_id","section","direction","performance","report_title","telegram_account","suggestions"];
  const out = {};
  keys.forEach(k=> out[k] = state[k] || "");
  return out;
}

function isStepComplete(step){
  if(!step) return false;
  if(step.kind==="text" || step.kind==="textarea") return step.optional || !!(state[step.field] && state[step.field].trim());
  if(step.kind==="chips" || step.kind==="picker") return !!state[step.field];
  if(step.kind==="section") return !!state.section_id;
  if(step.kind==="direction") return !!state.direction;
  if(step.kind==="checkpoint") return !!state[step.doneFlag];
  return true;
}

const shell = document.getElementById("step_shell");
const backBtn = document.getElementById("back_btn");
const primaryBtn = document.getElementById("primary_btn");
const progressFill = document.getElementById("progress_fill");
const toast = document.getElementById("toast");

function showToast(msg, kind){
  toast.textContent = msg;
  toast.className = "toast show" + (kind ? " " + kind : "");
  setTimeout(()=>{ toast.className = "toast" + (kind ? " " + kind : ""); }, 2200);
}

function goTo(id){ currentId = id; render(); window.scrollTo(0,0); }
function goNext(){
  const vs = visibleSteps();
  const i = vs.findIndex(s=>s.id===currentId);
  if(i > -1 && i < vs.length - 1) goTo(vs[i+1].id);
}
function goBack(){
  const vs = visibleSteps();
  const i = vs.findIndex(s=>s.id===currentId);
  if(i > 0) goTo(vs[i-1].id);
}

function fireCheckpoint(step){
  if(!inTelegram){
    state[step.doneFlag] = true;
    showToast("Test rejimida: qabul qilingan deb belgilandi", "info");
    goNext();
    return;
  }
  tg.sendData(JSON.stringify({type:"checkpoint", step: step.checkpoint, data: textPayload()}));
  tg.close();
}

function sendFinal(){
  hapticNotify("success");
  tg.sendData(JSON.stringify({type:"final", data: textPayload()}));
  tg.close();
}

/* ---- University sheet ---- */
const uniBackdrop = document.getElementById("uni_backdrop");
const uniSheet = document.getElementById("uni_sheet");
const uniList = document.getElementById("uni_list");
const uniSearch = document.getElementById("uni_search");

function renderUniList(filter){
  const q = (filter||"").trim().toLowerCase();
  const items = UNIVERSITIES.filter(u=>u.toLowerCase().includes(q));
  uniList.innerHTML = "";
  if(!items.length){ uniList.innerHTML = '<div class="sheet-empty">Hech narsa topilmadi</div>'; return; }
  items.forEach(name=>{
    const row = document.createElement("div");
    row.className = "sheet-item" + (state.university===name ? " active" : "");
    row.textContent = name;
    row.onclick = ()=>{
      state.university = name;
      hapticSelect();
      closeUniSheet();
      render();
      setTimeout(goNext, 180);
    };
    uniList.appendChild(row);
  });
}
function openUniSheet(){ renderUniList(uniSearch.value); uniBackdrop.classList.add("show"); uniSheet.classList.add("show"); haptic("light"); }
function closeUniSheet(){ uniBackdrop.classList.remove("show"); uniSheet.classList.remove("show"); }
uniBackdrop.onclick = closeUniSheet;
uniSearch.addEventListener("input", ()=>renderUniList(uniSearch.value));

/* ---- Renderers ---- */
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }

function renderHeader(step){
  return `<p class="step-eyebrow">Bosqich</p><h2 class="step-title">${step.title}</h2><p class="step-hint">${step.hint||""}</p>`;
}

function renderText(step, card){
  card.insertAdjacentHTML("beforeend", `<input type="text" id="field_input" placeholder="${step.placeholder||""}" autocomplete="off">`);
  const input = card.querySelector("#field_input");
  input.value = state[step.field] || "";
  input.addEventListener("input", ()=>{ state[step.field] = input.value; syncPrimary(); });
  setTimeout(()=>input.focus({preventScroll:true}), 250);
}

function renderTextarea(step, card){
  card.insertAdjacentHTML("beforeend", `<textarea id="field_input" placeholder="${step.placeholder||""}"></textarea>`);
  const input = card.querySelector("#field_input");
  input.value = state[step.field] || "";
  input.addEventListener("input", ()=>{ state[step.field] = input.value; syncPrimary(); });
}

function renderChips(step, card){
  const box = el(`<div class="chip-group"></div>`);
  step.options.forEach(([value,label])=>{
    const chip = el(`<div class="chip${state[step.field]===value?" active":""}">${label}</div>`);
    chip.onclick = ()=>{
      state[step.field] = value;
      if(step.field === "performance"){ state.article_done=false; state.presentation_done=false; }
      hapticSelect();
      render();
      setTimeout(goNext, 180);
    };
    box.appendChild(chip);
  });
  card.appendChild(box);
}

function renderPicker(step, card){
  const trigger = el(`<div class="select-trigger"><span class="val ${state.university?"":"placeholder"}">${state.university||"Tanlash uchun bosing"}</span><span class="chev">▾</span></div>`);
  trigger.onclick = openUniSheet;
  card.appendChild(trigger);
}

function renderSection(step, card){
  const box = el(`<div class="tile-list"></div>`);
  Object.entries(SECTIONS).forEach(([id,val])=>{
    const tile = el(`<div class="tile${state.section_id===id?" active":""}"><span>${val[0]}</span><span class="check">✓</span></div>`);
    tile.onclick = ()=>{
      if(state.section_id !== id){ state.section_id = id; state.section = val[0]; state.direction = ""; }
      hapticSelect();
      render();
      setTimeout(goNext, 180);
    };
    box.appendChild(tile);
  });
  card.appendChild(box);
}

function renderDirection(step, card){
  if(!state.section_id){
    card.insertAdjacentHTML("beforeend", `<p class="step-hint">Avval seksiyani tanlang.</p>`);
    return;
  }
  const box = el(`<div class="tile-list"></div>`);
  SECTIONS[state.section_id][1].forEach(name=>{
    const tile = el(`<div class="tile${state.direction===name?" active":""}"><span>${name}</span><span class="check">✓</span></div>`);
    tile.onclick = ()=>{
      state.direction = name;
      hapticSelect();
      render();
      setTimeout(goNext, 180);
    };
    box.appendChild(tile);
  });
  card.appendChild(box);
}

function renderCheckpoint(step, card){
  card.insertAdjacentHTML("beforeend", `<div class="checkpoint-icon">${step.icon}</div><p class="checkpoint-desc">${step.desc}</p>`);
  if(state[step.doneFlag]){
    card.insertAdjacentHTML("beforeend", `<div class="checkpoint-done">✅ Qabul qilindi</div>`);
  }
}

function renderReview(step, card){
  const rows = [
    ["Ism-familiya", state.full_name], ["Status", state.role], ["Ilmiy rahbar", state.supervisor],
    ["Rahbar lavozimi", state.head_position], ["Universitet", state.university], ["Seksiya", state.section],
    ["Yo‘nalish", state.direction], ["Qatnashish turi", state.performance],
  ];
  if(needsPresentation(state)) rows.push(["Ma'ruza mavzusi", state.report_title]);
  rows.push(["Telegram akkaunt", state.telegram_account]);
  const box = el(`<div></div>`);
  rows.forEach(([k,v])=>{
    box.appendChild(el(`<div class="review-row"><span class="k">${k}</span><span class="v">${(v||"—")}</span></div>`));
  });
  card.appendChild(box);

  const flags = [
    {label:"Pasport", ok: state.passport_done, step:"passport"},
    {label:"Telefon raqam", ok: state.phone_done, step:"phone"},
  ];
  if(needsArticle(state)) flags.push({label:"Maqola va antiplagiat", ok: state.article_done, step:"files"});
  if(needsPresentation(state)) flags.push({label:"Taqdimot fayli", ok: state.presentation_done, step:"presentation"});
  const flagBox = el(`<div style="margin-top:10px"></div>`);
  flags.forEach(f=>{
    const row = el(`<div class="review-flag ${f.ok?"ok":"missing"}">${f.ok?"✅":"⚠️"} ${f.label}${f.ok?"":" — yuklanmagan, bosing"}</div>`);
    if(!f.ok) row.onclick = ()=>goTo(f.step);
    flagBox.appendChild(row);
  });
  card.appendChild(flagBox);
}

function allComplete(){
  return visibleSteps().every(s => s.id==="review" || isStepComplete(s));
}

function render(){
  const vs = visibleSteps();
  let step = findStep(currentId);
  if(!step || !vs.includes(step)){ step = vs[0]; currentId = step.id; }
  const idx = vs.findIndex(s=>s.id===currentId);
  progressFill.style.width = Math.round(((idx+1)/vs.length)*100) + "%";

  shell.innerHTML = "";
  const card = el(`<div class="card"></div>`);
  card.insertAdjacentHTML("beforeend", renderHeader(step));
  const bodyHost = card;

  if(step.kind==="text") renderText(step, bodyHost);
  else if(step.kind==="textarea") renderTextarea(step, bodyHost);
  else if(step.kind==="chips") renderChips(step, bodyHost);
  else if(step.kind==="picker") renderPicker(step, bodyHost);
  else if(step.kind==="section") renderSection(step, bodyHost);
  else if(step.kind==="direction") renderDirection(step, bodyHost);
  else if(step.kind==="checkpoint") renderCheckpoint(step, bodyHost);
  else if(step.kind==="review") renderReview(step, bodyHost);

  shell.appendChild(card);

  backBtn.style.visibility = idx===0 ? "hidden" : "visible";
  try{ if(idx===0) tg.BackButton.hide(); else tg.BackButton.show(); }catch(e){}

  if(step.kind==="checkpoint"){
    primaryBtn.textContent = state[step.doneFlag] ? "➡️ Keyingisi" : step.buttonLabel;
    primaryBtn.disabled = false;
    primaryBtn.onclick = ()=> state[step.doneFlag] ? goNext() : fireCheckpoint(step);
  } else if(step.kind==="review"){
    const ready = allComplete();
    primaryBtn.textContent = "✅ Yuborish";
    primaryBtn.disabled = !ready;
    primaryBtn.onclick = sendFinal;
  } else if(step.kind==="section" || step.kind==="direction" || step.kind==="chips" || step.kind==="picker"){
    primaryBtn.textContent = "Davom etish ➡️";
    primaryBtn.disabled = !isStepComplete(step);
    primaryBtn.onclick = goNext;
  } else {
    primaryBtn.textContent = "Davom etish ➡️";
    primaryBtn.onclick = ()=>{
      if(!isStepComplete(step)){ showToast("Iltimos, maydonni to‘ldiring"); hapticNotify("error"); return; }
      goNext();
    };
    syncPrimary();
  }
}

function syncPrimary(){
  const step = findStep(currentId);
  if(!step || (step.kind!=="text" && step.kind!=="textarea")) return;
  primaryBtn.disabled = !isStepComplete(step);
}

backBtn.onclick = goBack;
try{ tg.BackButton.onClick(goBack); }catch(e){}

render();
</script>
</body>
</html>
